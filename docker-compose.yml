services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    command: >
      sh -c "until python manage.py migrate --noinput; do
        echo 'Waiting for database migrations to become available...';
        sleep 2;
      done
      && python manage.py seed_validation_research_ops
      && python manage.py runserver 0.0.0.0:8000"
    env_file: .env.example
    environment:
      DJANGO_SETTINGS_MODULE: gradsync.settings.local
    volumes:
      - ./backend:/app/backend
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    volumes:
      - ./frontend:/app/frontend
      - frontend_node_modules:/app/frontend/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

  worker:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    command: celery -A gradsync worker -l info
    env_file: .env.example
    environment:
      DJANGO_SETTINGS_MODULE: gradsync.settings.local
    volumes:
      - ./backend:/app/backend
    depends_on:
      - backend
      - redis

  scheduler:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    command: celery -A gradsync beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: .env.example
    environment:
      DJANGO_SETTINGS_MODULE: gradsync.settings.local
    volumes:
      - ./backend:/app/backend
    depends_on:
      - backend
      - redis

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: gradsync
      POSTGRES_USER: gradsync
      POSTGRES_PASSWORD: gradsync
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
  frontend_node_modules:
