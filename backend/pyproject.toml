[project]
name = "gradsync-backend"
version = "0.1.0"
description = "Django backend for GradSync research group operations"
requires-python = ">=3.12"
dependencies = [
  "celery>=5.4,<6",
  "django>=5.0,<6",
  "django-celery-beat>=2.6,<3",
  "django-celery-results>=2.5,<3",
  "djangorestframework>=3.15,<4",
  "drf-spectacular>=0.27,<1",
  "gunicorn>=22,<24",
  "psycopg[binary]>=3.2,<4",
  "pypdf>=4,<6",
  "PyYAML>=6,<7",
  "redis>=5,<6",
  "sentry-sdk>=2,<3",
]

[project.optional-dependencies]
dev = [
  "factory-boy>=3.3,<4",
  "pytest>=8,<9",
  "pytest-django>=4.8,<5",
  "pytest-cov>=5,<6",
  "ruff>=0.6,<1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "gradsync.settings.test"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]
addopts = "--strict-markers --disable-warnings"

[tool.setuptools.packages.find]
include = ["apps*", "gradsync*"]
