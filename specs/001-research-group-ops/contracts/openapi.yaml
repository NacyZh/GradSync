openapi: 3.0.3
info:
  title: GradSync Research Group Operations API
  version: 0.1.0
  description: >
    Project-scoped API contract for research projects, hierarchical tasks,
    weekly reports, inline advisor comments, configurable
    resource bookings, paper team libraries, code team libraries, locale
    preferences, downloads, and email notification records.
servers:
  - url: /api
security:
  - sessionAuth: []
paths:
  /projects:
    get:
      summary: List projects visible to the current user
      operationId: listProjects
      tags: [Projects]
      responses:
        "200":
          description: Visible projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      summary: Create a research project
      operationId: createProject
      tags: [Projects]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreate"
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /projects/{projectId}:
    get:
      summary: Get a project dashboard
      operationId: getProjectDashboard
      tags: [Projects]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDashboard"
        "403":
          $ref: "#/components/responses/Forbidden"
  /projects/{projectId}/members:
    post:
      summary: Add a member to a project
      operationId: addProjectMember
      tags: [Projects]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MembershipCreate"
      responses:
        "201":
          description: Member added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMembership"
        "403":
          $ref: "#/components/responses/Forbidden"
  /projects/{projectId}/tasks:
    get:
      summary: List project tasks
      operationId: listProjectTasks
      tags: [Tasks]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project task tree
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      summary: Create a project task
      operationId: createProjectTask
      tags: [Tasks]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCreate"
      responses:
        "201":
          description: Task created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "422":
          $ref: "#/components/responses/ValidationError"
  /projects/{projectId}/tasks/{taskId}:
    patch:
      summary: Update task fields or status
      operationId: updateProjectTask
      tags: [Tasks]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Task updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
  /projects/{projectId}/reports:
    get:
      summary: List weekly progress reports
      operationId: listWeeklyReports
      tags: [Reports]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project weekly reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WeeklyReport"
    post:
      summary: Submit a weekly progress report
      operationId: submitWeeklyReport
      tags: [Reports]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WeeklyReportCreate"
      responses:
        "201":
          description: Weekly report submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeeklyReport"
        "409":
          description: Report already exists for this student and week
  /projects/{projectId}/comments:
    post:
      summary: Add an inline comment to a weekly report
      operationId: createInlineComment
      tags: [Comments]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InlineCommentCreate"
      responses:
        "201":
          description: Comment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InlineComment"
        "422":
          $ref: "#/components/responses/ValidationError"
  /resource-types:
    get:
      summary: List configurable resource types
      operationId: listResourceTypes
      tags: [Resources]
      responses:
        "200":
          description: Resource type templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResourceType"
    post:
      summary: Create a configurable resource type
      operationId: createResourceType
      tags: [Resources]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourceTypeCreate"
      responses:
        "201":
          description: Resource type created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceType"
  /resource-items:
    get:
      summary: List resource items
      operationId: listResourceItems
      tags: [Resources]
      responses:
        "200":
          description: Available and unavailable resource items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResourceItem"
  /projects/{projectId}/bookings:
    get:
      summary: List project bookings
      operationId: listProjectBookings
      tags: [Bookings]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"
    post:
      summary: Reserve a configured resource item
      operationId: createBooking
      tags: [Bookings]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingCreate"
      responses:
        "201":
          description: Booking confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "409":
          description: Booking conflicts with an existing reservation
  /projects/{projectId}/notifications:
    get:
      summary: List notification delivery records for a project
      operationId: listProjectNotifications
      tags: [Notifications]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Notification records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
  /projects/{projectId}/papers:
    get:
      summary: Search project paper records
      operationId: listProjectPapers
      tags: [Papers]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: q
          in: query
          schema:
            type: string
        - name: tag
          in: query
          schema:
            type: string
        - name: year
          in: query
          schema:
            type: integer
        - name: author
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Project-scoped paper records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaperRecord"
    post:
      summary: Create or edit a project paper metadata record
      operationId: createProjectPaper
      tags: [Papers]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaperRecordCreate"
      responses:
        "201":
          description: Paper record created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaperRecord"
        "409":
          description: Duplicate paper detected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DuplicatePaperError"
  /projects/{projectId}/papers/imports:
    post:
      summary: Stage a local paper import batch with duplicate detection
      operationId: stagePaperImport
      tags: [Papers]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaperImportRequest"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/PaperImportUploadRequest"
      responses:
        "201":
          description: Import batch staged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaperImportBatch"
  /projects/{projectId}/papers/imports/{batchId}/commit:
    post:
      summary: Commit accepted paper import batch items
      operationId: commitPaperImport
      tags: [Papers]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: batchId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Import batch committed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaperImportBatch"
  /projects/{projectId}/papers/{paperId}/download:
    post:
      summary: Download an authorized paper attachment
      operationId: downloadPaperAttachment
      tags: [Papers, Downloads]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: paperId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Download descriptor or file response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadDescriptor"
        "403":
          $ref: "#/components/responses/Forbidden"
  /projects/{projectId}/code-artifacts:
    get:
      summary: Search project code artifacts
      operationId: listCodeArtifacts
      tags: [CodeArtifacts]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: q
          in: query
          schema:
            type: string
        - name: tag
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Project-scoped code artifacts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CodeArtifact"
    post:
      summary: Create a project code artifact
      operationId: createCodeArtifact
      tags: [CodeArtifacts]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodeArtifactCreate"
      responses:
        "201":
          description: Code artifact created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeArtifact"
  /projects/{projectId}/code-artifacts/{artifactId}/versions:
    post:
      summary: Import a code artifact version from a local folder or archive
      operationId: importCodeArtifactVersion
      tags: [CodeArtifacts]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: artifactId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodeArtifactVersionCreate"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CodeArtifactVersionUploadRequest"
      responses:
        "201":
          description: Code artifact version imported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeArtifactVersion"
        "409":
          description: Duplicate checksum or version label
  /projects/{projectId}/code-artifacts/{artifactId}/versions/{versionId}/download:
    post:
      summary: Download an authorized code artifact version
      operationId: downloadCodeArtifactVersion
      tags: [CodeArtifacts, Downloads]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: artifactId
          in: path
          required: true
          schema:
            type: string
        - name: versionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Download descriptor or file response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadDescriptor"
        "403":
          $ref: "#/components/responses/Forbidden"
  /account/locale:
    get:
      summary: Get current user's locale preference
      operationId: getLocalePreference
      tags: [Account]
      responses:
        "200":
          description: Locale preference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalePreference"
    put:
      summary: Update current user's locale preference
      operationId: updateLocalePreference
      tags: [Account]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocalePreferenceUpdate"
      responses:
        "200":
          description: Locale preference updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalePreference"
components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: sessionid
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
  responses:
    Forbidden:
      description: Current user is not authorized for this project or action
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: Request failed validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
        fields:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    Project:
      type: object
      required: [id, title, advisorId, status]
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        advisorId:
          type: string
        status:
          type: string
          enum: [active, archived]
        startsOn:
          type: string
          format: date
        endsOn:
          type: string
          format: date
    ProjectCreate:
      type: object
      required: [title, advisorId]
      properties:
        title:
          type: string
        description:
          type: string
        advisorId:
          type: string
        startsOn:
          type: string
          format: date
        endsOn:
          type: string
          format: date
        studentIds:
          type: array
          items:
            type: string
    ProjectDashboard:
      type: object
      required: [project, currentTasks, pendingReviews, upcomingBookings]
      properties:
        project:
          $ref: "#/components/schemas/Project"
        currentTasks:
          type: array
          items:
            $ref: "#/components/schemas/Task"
        pendingReviews:
          type: array
          items:
            type: object
            properties:
              targetType:
                type: string
              targetId:
                type: string
              submittedAt:
                type: string
                format: date-time
        upcomingBookings:
          type: array
          items:
            $ref: "#/components/schemas/Booking"
    MembershipCreate:
      type: object
      required: [userId, role]
      properties:
        userId:
          type: string
        role:
          type: string
          enum: [advisor, student, reviewer, observer]
    ProjectMembership:
      type: object
      required: [id, projectId, userId, role, status]
      properties:
        id:
          type: string
        projectId:
          type: string
        userId:
          type: string
        role:
          type: string
        status:
          type: string
          enum: [active, removed]
    Task:
      type: object
      required: [id, projectId, title, status]
      properties:
        id:
          type: string
        projectId:
          type: string
        parentTaskId:
          type: string
          nullable: true
        title:
          type: string
        description:
          type: string
        assigneeId:
          type: string
          nullable: true
        status:
          type: string
          enum: [not_started, in_progress, blocked, submitted, completed, cancelled]
        priority:
          type: string
          enum: [low, normal, high, urgent]
        deadlineAt:
          type: string
          format: date-time
    TaskCreate:
      type: object
      required: [title]
      properties:
        parentTaskId:
          type: string
        title:
          type: string
        description:
          type: string
        assigneeId:
          type: string
        priority:
          type: string
        deadlineAt:
          type: string
          format: date-time
    TaskUpdate:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        assigneeId:
          type: string
        status:
          type: string
        priority:
          type: string
        deadlineAt:
          type: string
          format: date-time
    WeeklyReport:
      type: object
      required: [id, projectId, studentId, reportWeekStart, reviewStatus]
      properties:
        id:
          type: string
        projectId:
          type: string
        studentId:
          type: string
        reportWeekStart:
          type: string
          format: date
        completedWork:
          type: string
        blockers:
          type: string
        nextSteps:
          type: string
        reviewStatus:
          type: string
          enum: [pending_review, reviewed, needs_revision, closed]
    WeeklyReportCreate:
      type: object
      required: [reportWeekStart, completedWork, nextSteps]
      properties:
        reportWeekStart:
          type: string
          format: date
        completedWork:
          type: string
        blockers:
          type: string
        nextSteps:
          type: string
        attachmentReference:
          type: string
    InlineComment:
      type: object
      required: [id, projectId, targetType, targetId, authorId, anchor, body, status]
      properties:
        id:
          type: string
        projectId:
          type: string
        targetType:
          type: string
          enum: [progress_report]
        targetId:
          type: string
        authorId:
          type: string
        anchor:
          type: string
        body:
          type: string
        status:
          type: string
          enum: [open, resolved]
    InlineCommentCreate:
      type: object
      required: [targetType, targetId, anchor, body]
      properties:
        targetType:
          type: string
          enum: [progress_report]
        targetId:
          type: string
        anchor:
          type: string
        body:
          type: string
    ResourceType:
      type: object
      required: [id, name, fieldSchema, bookingPolicy, status]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        scope:
          type: string
          enum: [global, project]
        fieldSchema:
          type: array
          items:
            $ref: "#/components/schemas/ResourceField"
        eligibilityPolicy:
          type: object
          additionalProperties: true
        bookingPolicy:
          type: object
          additionalProperties: true
        status:
          type: string
          enum: [active, archived]
    ResourceTypeCreate:
      type: object
      required: [name, fieldSchema]
      properties:
        name:
          type: string
        description:
          type: string
        scope:
          type: string
          enum: [global, project]
        fieldSchema:
          type: array
          items:
            $ref: "#/components/schemas/ResourceField"
        eligibilityPolicy:
          type: object
          additionalProperties: true
        bookingPolicy:
          type: object
          additionalProperties: true
    ResourceField:
      type: object
      required: [key, label, fieldType, required]
      properties:
        key:
          type: string
        label:
          type: string
        fieldType:
          type: string
          enum: [text, number, boolean, select, multi_select, date]
        required:
          type: boolean
        options:
          type: array
          items:
            type: string
    ResourceItem:
      type: object
      required: [id, resourceTypeId, name, status]
      properties:
        id:
          type: string
        resourceTypeId:
          type: string
        name:
          type: string
        description:
          type: string
        location:
          type: string
        fieldValues:
          type: object
          additionalProperties: true
        availabilityPolicy:
          type: object
          additionalProperties: true
        status:
          type: string
          enum: [available, unavailable, retired]
    ResourceItemCreate:
      type: object
      required: [resourceTypeId, name]
      properties:
        resourceTypeId:
          type: string
        name:
          type: string
        description:
          type: string
        location:
          type: string
        fieldValues:
          type: object
          additionalProperties: true
        availabilityPolicy:
          type: object
          additionalProperties: true
    Booking:
      type: object
      required: [id, projectId, resourceItemId, requestedById, startsAt, endsAt, status]
      properties:
        id:
          type: string
        projectId:
          type: string
        resourceItemId:
          type: string
        requestedById:
          type: string
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [reserved, cancelled, completed]
        purpose:
          type: string
    BookingCreate:
      type: object
      required: [resourceItemId, startsAt, endsAt]
      properties:
        resourceItemId:
          type: string
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        purpose:
          type: string
    Notification:
      type: object
      required: [id, projectId, recipientId, eventType, targetType, targetId, status]
      properties:
        id:
          type: string
        projectId:
          type: string
        recipientId:
          type: string
        eventType:
          type: string
          enum: [new_submission, pending_review, approaching_deadline, booking_changed]
        targetType:
          type: string
        targetId:
          type: string
        status:
          type: string
          enum: [pending, queued, sent, failed, skipped]
        eligibleAt:
          type: string
          format: date-time
    PaperRecord:
      type: object
      required: [id, projectId, title, authors, status]
      properties:
        id:
          type: string
        projectId:
          type: string
        title:
          type: string
        authors:
          type: array
          items:
            type: string
        venue:
          type: string
        publicationYear:
          type: integer
        doi:
          type: string
        externalIds:
          type: object
          additionalProperties:
            type: string
        abstract:
          type: string
        notes:
          type: string
        tags:
          type: array
          items:
            type: string
        importSource:
          type: string
          enum: [manual, local_folder, local_file, bibtex, text_metadata, batch]
        sourcePathLabel:
          type: string
        status:
          type: string
          enum: [active, duplicate_blocked, archived]
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/PaperAttachment"
    PaperRecordCreate:
      type: object
      required: [title, authors]
      properties:
        title:
          type: string
        authors:
          type: array
          items:
            type: string
        venue:
          type: string
        publicationYear:
          type: integer
        doi:
          type: string
        externalIds:
          type: object
          additionalProperties:
            type: string
        abstract:
          type: string
        notes:
          type: string
        tags:
          type: array
          items:
            type: string
        sourcePathLabel:
          type: string
    PaperAttachment:
      type: object
      required: [id, paperId, filename, checksumSha256, status]
      properties:
        id:
          type: string
        paperId:
          type: string
        filename:
          type: string
        relativePath:
          type: string
        contentType:
          type: string
        sizeBytes:
          type: integer
        checksumSha256:
          type: string
        status:
          type: string
          enum: [active, replaced, archived]
    PaperImportRequest:
      type: object
      required: [sourceType, items]
      properties:
        sourceType:
          type: string
          enum: [local_folder, local_file, bibtex_file, text_metadata_file, mixed_local]
        sourcePathLabel:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/PaperRecordCreate"
