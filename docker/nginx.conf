worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  sendfile on;

  proxy_temp_path /tmp/proxy_temp;
  client_body_temp_path /tmp/client_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  upstream gradsync_backend {
    server backend:8000;
  }

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 30m;

    location /api/ {
      proxy_pass http://gradsync_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Request-ID $request_id;
      add_header Cache-Control "no-store" always;
    }

    location = /healthz {
      return 301 /healthz/;
    }

    location = /healthz/ {
      proxy_pass http://gradsync_backend/healthz/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $request_id;
      add_header Cache-Control "no-store" always;
    }

    location = /readyz/ {
      proxy_pass http://gradsync_backend/readyz/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $request_id;
      add_header Cache-Control "no-store" always;
    }

    location = /metrics/ {
      proxy_pass http://gradsync_backend/metrics/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $request_id;
      add_header Cache-Control "no-store" always;
    }

    location = /sw.js {
      try_files $uri =404;
      add_header Cache-Control "no-store" always;
      add_header Service-Worker-Allowed "/" always;
    }

    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
      try_files $uri /index.html;
      add_header Cache-Control "no-store" always;
    }
  }
}
