services:
  migrate:
    image: ${BACKEND_IMAGE:-gradsync-backend:local}
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file:
      - path: .env.production.example
      - path: .env.production
        required: false
    command: >
      sh -c "python manage.py migrate --noinput
      && python manage.py cleanup_seeded_library_papers
      && python manage.py cleanup_seeded_code_artifacts
      && python manage.py cleanup_seeded_library_documents"
    mem_limit: ${GRADSYNC_MIGRATE_MEM_LIMIT:-256m}
    restart: "no"
    volumes:
      - backend_media:/app/backend/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - data

  backend:
    image: ${BACKEND_IMAGE:-gradsync-backend:local}
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file:
      - path: .env.production.example
      - path: .env.production
        required: false
    environment:
      GRADSYNC_COLLECT_STATIC: "true"
    command:
      - sh
      - -c
      - >
        exec gunicorn gradsync.wsgi:application
        --bind 0.0.0.0:8000
        --workers "$${GRADSYNC_GUNICORN_WORKERS:-1}"
        --threads "$${GRADSYNC_GUNICORN_THREADS:-2}"
        --access-logfile -
        --error-logfile -
    mem_limit: ${GRADSYNC_BACKEND_MEM_LIMIT:-256m}
    restart: unless-stopped
    volumes:
      - backend_media:/app/backend/media
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; req=urllib.request.Request('http://127.0.0.1:8000/healthz/', headers={'Host':'127.0.0.1','X-Forwarded-Proto':'https'}); urllib.request.urlopen(req, timeout=2)\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - app
      - data

  frontend:
    image: ${FRONTEND_IMAGE:-gradsync-frontend:local}
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        NPM_CONFIG_REGISTRY: ${GRADSYNC_NPM_REGISTRY:-https://registry.npmjs.org}
        NPM_CONFIG_FETCH_RETRIES: ${GRADSYNC_NPM_FETCH_RETRIES:-2}
        NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: ${GRADSYNC_NPM_FETCH_RETRY_MINTIMEOUT_MS:-5000}
        NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: ${GRADSYNC_NPM_FETCH_RETRY_MAXTIMEOUT_MS:-30000}
        NPM_CONFIG_FETCH_TIMEOUT: ${GRADSYNC_NPM_FETCH_TIMEOUT_MS:-120000}
        NPM_CONFIG_MAXSOCKETS: ${GRADSYNC_NPM_MAXSOCKETS:-8}
        NPM_CI_TIMEOUT_SECONDS: ${GRADSYNC_NPM_CI_TIMEOUT_SECONDS:-600}
    env_file:
      - path: .env.production.example
      - path: .env.production
        required: false
    ports:
      - "8080:8080"
    mem_limit: ${GRADSYNC_FRONTEND_MEM_LIMIT:-96m}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz/ >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - app

  worker:
    image: ${BACKEND_IMAGE:-gradsync-backend:local}
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file:
      - path: .env.production.example
      - path: .env.production
        required: false
    command:
      - sh
      - -c
      - >
        exec celery -A gradsync worker -l info -Q default,notifications
        --concurrency="$${GRADSYNC_CELERY_CONCURRENCY:-1}"
        --prefetch-multiplier="$${CELERY_WORKER_PREFETCH_MULTIPLIER:-1}"
    mem_limit: ${GRADSYNC_WORKER_MEM_LIMIT:-256m}
    restart: unless-stopped
    volumes:
      - backend_media:/app/backend/media
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A gradsync inspect ping -d celery@$${HOSTNAME} >/dev/null"]
      interval: 60s
      timeout: 10s
      retries: 3
    networks:
      - data

  scheduler:
    image: ${BACKEND_IMAGE:-gradsync-backend:local}
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file:
      - path: .env.production.example
      - path: .env.production
        required: false
    command:
      - celery
      - -A
      - gradsync
      - beat
      - -l
      - info
      - --scheduler
      - django_celery_beat.schedulers:DatabaseScheduler
    mem_limit: ${GRADSYNC_SCHEDULER_MEM_LIMIT:-160m}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - data

  db:
    image: postgres:16
    env_file:
      - path: .env.production.example
      - path: .env.production
        required: false
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_backups:/backups
    command:
      - postgres
      - -c
      - max_connections=${GRADSYNC_POSTGRES_MAX_CONNECTIONS:-40}
      - -c
      - shared_buffers=${GRADSYNC_POSTGRES_SHARED_BUFFERS:-64MB}
      - -c
      - work_mem=${GRADSYNC_POSTGRES_WORK_MEM:-2MB}
      - -c
      - maintenance_work_mem=${GRADSYNC_POSTGRES_MAINTENANCE_WORK_MEM:-32MB}
    mem_limit: ${GRADSYNC_DB_MEM_LIMIT:-384m}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - data

  redis:
    image: redis:7
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    mem_limit: ${GRADSYNC_REDIS_MEM_LIMIT:-128m}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - data

volumes:
  # Explicit names keep production data attached even if the repository path or
  # Compose project name changes between CI/CD deployments.
  postgres_data:
    name: ${GRADSYNC_POSTGRES_VOLUME_NAME:-gradsync-production-postgres-data}
  postgres_backups:
    name: ${GRADSYNC_POSTGRES_BACKUP_VOLUME_NAME:-gradsync-production-postgres-backups}
  backend_media:
    name: ${GRADSYNC_MEDIA_VOLUME_NAME:-gradsync-production-media}
  redis_data:
    name: ${GRADSYNC_REDIS_VOLUME_NAME:-gradsync-production-redis}

networks:
  app:
  data:
    internal: true
