name: CI/CD

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gradsync
          POSTGRES_USER: gradsync
          POSTGRES_PASSWORD: gradsync
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gradsync -d gradsync"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Check generated artifacts
        run: sh scripts/check-generated-artifacts.sh
      - name: Lint backend
        working-directory: backend
        run: ruff check .
      - name: Check migrations
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: gradsync.settings.test
        run: python manage.py makemigrations --check --dry-run
      - name: Run backend tests
        working-directory: backend
        env:
          POSTGRES_HOST: localhost
          REDIS_URL: redis://localhost:6379/0
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Install backend for full-stack e2e
        working-directory: backend
        run: |
          python3 -m venv ../.venv
          ../.venv/bin/python -m pip install -e ".[dev]"
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Test frontend
        working-directory: frontend
        run: npm test
      - name: Run full-stack Playwright tests
        working-directory: frontend
        env:
          GRADSYNC_E2E_MODE: fullstack
          GRADSYNC_BACKEND_PYTHON: ../.venv/bin/python
        run: npm run test:e2e
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  deploy-production:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    environment:
      name: production
      url: https://120021123.xyz
    env:
      DEPLOY_HOST: ${{ vars.GRADSYNC_PRODUCTION_HOST }}
      DEPLOY_USER: ${{ vars.GRADSYNC_PRODUCTION_USER || 'deploy' }}
      DEPLOY_PORT: ${{ vars.GRADSYNC_PRODUCTION_SSH_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.GRADSYNC_DEPLOY_PATH || '/home/GradSync/GradSync' }}
      DEPLOY_BRANCH: master
      PUBLIC_URL: ${{ vars.GRADSYNC_PUBLIC_URL || 'https://120021123.xyz' }}
      PRODUCTION_ENV_FILE: ${{ secrets.PRODUCTION_ENV_FILE }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment inputs
        run: |
          test -n "${DEPLOY_HOST}" || { echo "GRADSYNC_PRODUCTION_HOST variable is required"; exit 1; }
          test -n "${{ secrets.PRODUCTION_DEPLOY_SSH_KEY }}" || { echo "PRODUCTION_DEPLOY_SSH_KEY secret is required"; exit 1; }
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.PRODUCTION_DEPLOY_SSH_KEY }}" > ~/.ssh/gradsync_deploy
          chmod 600 ~/.ssh/gradsync_deploy
          ssh-keyscan -p "${DEPLOY_PORT}" -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts
      - name: Sync production env file
        run: |
          if [ -n "${PRODUCTION_ENV_FILE}" ]; then
            printf '%s' "${PRODUCTION_ENV_FILE}" | ssh -i ~/.ssh/gradsync_deploy -p "${DEPLOY_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
              "umask 077; cat > '${DEPLOY_PATH}/.env.production.tmp' && mv '${DEPLOY_PATH}/.env.production.tmp' '${DEPLOY_PATH}/.env.production'"
          else
            echo "PRODUCTION_ENV_FILE is empty; keeping existing server .env.production"
          fi
      - name: Deploy on production host
        run: |
          ssh -i ~/.ssh/gradsync_deploy -p "${DEPLOY_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "GRADSYNC_DEPLOY_PATH='${DEPLOY_PATH}' GRADSYNC_DEPLOY_BRANCH='${DEPLOY_BRANCH}' GRADSYNC_PUBLIC_URL='${PUBLIC_URL}' sh -s" \
            < scripts/deploy-production.sh
