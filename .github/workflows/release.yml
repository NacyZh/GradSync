name: CI/CD

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  DJANGO_SETTINGS_MODULE: gradsync.settings.ci
  POSTGRES_DB: gradsync
  POSTGRES_USER: gradsync
  POSTGRES_PASSWORD: gradsync
  POSTGRES_HOST: localhost
  REDIS_URL: redis://localhost:6379/0

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gradsync -d gradsync"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Check generated artifacts
        run: sh scripts/check-generated-artifacts.sh
      - name: Lint backend
        working-directory: backend
        run: python -m ruff check .
      - name: Check migrations
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run
      - name: Check legacy OpenAPI contract drift
        env:
          PYTHON: python
          OPENAPI_STRICT_SHAPES: "1"
        run: bash scripts/check-openapi-contract.sh specs/001-research-group-ops/contracts/openapi.yaml
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Check generated artifacts before frontend gates
        run: sh scripts/check-generated-artifacts.sh
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Test frontend
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        env:
          NODE_OPTIONS: --max-old-space-size=1536
        run: npm run build
      - name: Clean generated frontend build artifacts
        run: sh scripts/check-generated-artifacts.sh --clean
      - name: Check generated artifacts after frontend build
        run: sh scripts/check-generated-artifacts.sh

  frontend-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gradsync -d gradsync"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Install backend for full-stack e2e
        working-directory: backend
        run: |
          python -m venv ../.venv
          ../.venv/bin/python -m pip install -e ".[dev]"
      - name: Check generated artifacts before full-stack e2e
        run: sh scripts/check-generated-artifacts.sh
      - name: Run full-stack Playwright tests
        working-directory: frontend
        env:
          GRADSYNC_E2E_MODE: fullstack
          GRADSYNC_BACKEND_PYTHON: ../.venv/bin/python
          GRADSYNC_BACKEND_SETTINGS: ${{ env.DJANGO_SETTINGS_MODULE }}
        run: npm run test:e2e
      - name: Clean generated full-stack e2e artifacts
        if: always()
        run: sh scripts/check-generated-artifacts.sh --clean
      - name: Check generated artifacts after full-stack e2e
        run: sh scripts/check-generated-artifacts.sh

  production-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend, frontend-e2e]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Validate production Compose configuration
        run: docker compose -f docker-compose.prod.yml config --quiet
      - name: Build production backend image
        run: docker build -f docker/backend.Dockerfile -t gradsync-backend:ci .
      - name: Build production frontend image
        run: docker build -f docker/frontend.Dockerfile -t gradsync-frontend:ci .

  deploy-production:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend, frontend-e2e, production-image]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    concurrency:
      group: production
      cancel-in-progress: false
    environment:
      name: production
      url: https://120021123.xyz
    env:
      DEPLOY_HOST: ${{ vars.GRADSYNC_PRODUCTION_HOST }}
      DEPLOY_USER: ${{ vars.GRADSYNC_PRODUCTION_USER || 'deploy' }}
      DEPLOY_PORT: ${{ vars.GRADSYNC_PRODUCTION_SSH_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.GRADSYNC_DEPLOY_PATH || '/home/GradSync/GradSync' }}
      DEPLOY_BRANCH: master
      PUBLIC_URL: ${{ vars.GRADSYNC_PUBLIC_URL || 'https://120021123.xyz' }}
      PRODUCTION_ENV_FILE: ${{ secrets.PRODUCTION_ENV_FILE }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Validate deployment inputs
        run: |
          test -n "${DEPLOY_HOST}" || { echo "GRADSYNC_PRODUCTION_HOST variable is required"; exit 1; }
          test -n "${{ secrets.PRODUCTION_DEPLOY_SSH_KEY }}" || { echo "PRODUCTION_DEPLOY_SSH_KEY secret is required"; exit 1; }
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.PRODUCTION_DEPLOY_SSH_KEY }}" > ~/.ssh/gradsync_github_deploy
          chmod 600 ~/.ssh/gradsync_github_deploy
          echo "Scanning SSH host key for ${DEPLOY_HOST}:${DEPLOY_PORT}"
          if ! timeout 20 bash -c "cat < /dev/null > /dev/tcp/${DEPLOY_HOST}/${DEPLOY_PORT}"; then
            echo "Cannot open TCP connection to ${DEPLOY_HOST}:${DEPLOY_PORT} from GitHub Actions."
            echo "Check the server public IP, SSH port, cloud security group, host firewall, and sshd status."
            exit 1
          fi
          if ! ssh-keyscan -T 20 -p "${DEPLOY_PORT}" -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts; then
            echo "TCP connection opened, but ssh-keyscan failed for ${DEPLOY_HOST}:${DEPLOY_PORT}."
            echo "Check that the service on this port is SSH and that it sends an SSH host key."
            exit 1
          fi
          echo "Validating SSH authentication for ${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PORT}"
          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes \
            -i ~/.ssh/gradsync_github_deploy \
            -p "${DEPLOY_PORT}" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "echo ssh-ok"
      - name: Sync production env file
        timeout-minutes: 2
        run: |
          if [ -n "${PRODUCTION_ENV_FILE}" ]; then
            printf '%s' "${PRODUCTION_ENV_FILE}" | ssh \
              -o BatchMode=yes \
              -o ConnectTimeout=20 \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=3 \
              -o StrictHostKeyChecking=yes \
              -i ~/.ssh/gradsync_github_deploy \
              -p "${DEPLOY_PORT}" \
              "${DEPLOY_USER}@${DEPLOY_HOST}" \
              "umask 077; cat > '${DEPLOY_PATH}/.env.production.tmp' && mv '${DEPLOY_PATH}/.env.production.tmp' '${DEPLOY_PATH}/.env.production'"
          else
            echo "PRODUCTION_ENV_FILE is empty; keeping existing server .env.production"
          fi
      - name: Deploy on production host
        timeout-minutes: 25
        run: |
          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=6 \
            -o StrictHostKeyChecking=yes \
            -i ~/.ssh/gradsync_github_deploy \
            -p "${DEPLOY_PORT}" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "GRADSYNC_DEPLOY_PATH='${DEPLOY_PATH}' GRADSYNC_DEPLOY_BRANCH='${DEPLOY_BRANCH}' GRADSYNC_PUBLIC_URL='${PUBLIC_URL}' sh -s" \
            < scripts/deploy-production.sh
